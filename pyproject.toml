[project]
name = "daily-digest"
version = "0.1.0"
description = "Multi-agent daily digest: crosses Jira, calendar, mail and Teams chats into a cited, validated report (done / goals / next)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]

[project.scripts]
daily-digest = "daily_digest.cli:main"
daily-digest-mcp = "daily_digest.mcp_server:main"
daily-digest-web = "daily_digest.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: calls the real model (needs ANTHROPIC_API_KEY or a logged-in `claude`)",
    "integration: calls real Jira / Microsoft 365 (requiere credenciales)",
]
# Project-local temp dir: the shared %TEMP%\pytest-of-<user> symlink breaks on Windows when another run holds it.
addopts = "-m 'not llm and not integration' --basetemp=.pytest_tmp"
